<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Icône PixelCraft">
  <defs>
    <linearGradient id="pcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD7A8"/>
