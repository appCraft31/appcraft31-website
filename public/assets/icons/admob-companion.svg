      <stop offset="0" stop-color="#2A4E80"/>
      <stop offset="1" stop-color="#16233A"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="20" fill="url(#admob-companion-bg)"/>
  <rect x="0.5" y="0.5" width="99" height="99" rx="19.5" fill="none" stroke="rgba(138,180,248,0.35)"/>
