<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Icône Zellige">
  <!-- L'icône de l'app : une grille 3×3 de Tectonic en trois blocs, séparés par un joint clair. -->
  <rect width="100" height="100" rx="20" fill="#1E2F44"/>
  <rect x="11" y="11" width="78" height="78" rx="2" fill="#FBF9F5"/>
  <!-- Bloc bleu en L : cases (0,0) (1,0) (0,1) -->
  <path d="M13.5 13.5h48v25h-25v23h-23z" fill="#C9DCEA"/>
  <!-- Bloc beige : colonne droite, deux cases -->
  <rect x="63.5" y="13.5" width="23" height="48" fill="#EADFC8"/>
  <!-- Bloc sauge en L inversé : (1,1) (1,2) (2,2) -->
  <path d="M38.5 38.5h23v23h25v25h-48z" fill="#CFDCCB"/>
  <!-- Bloc terre cuite : une case -->
  <rect x="13.5" y="63.5" width="23" height="23" fill="#E8CFC4"/>
  <g fill="#1E2F44" font-family="Outfit, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="17" text-anchor="middle">
    <text x="25" y="32">1</text>
    <text x="75" y="32">2</text>
    <text x="50" y="57">3</text>
    <text x="25" y="82">2</text>
    <text x="75" y="82">1</text>
  </g>
</svg>
